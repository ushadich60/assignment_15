<html lang="en">

<body>
    <script>
let  world = "hello world  ";

console.log(world.charAt(0));
console.log(world.charAt(3));
console.log(world.length);


const aha =world.toUpperCase();

console.log(aha);
const aha2 =world.toLowerCase();

console.log(aha2);


const aha3 =world.includes("ll");

console.log(aha3);

const aha4 =world.includes("ls");

console.log(aha4);

const aha5 =world.indexOf("o");
console.log(aha5);


const aha6 =world.lastIndexOf("o");
console.log(aha6);

    </script>
</body>
